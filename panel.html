<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WorkBuddy</title>
<style>
/* ── token layer ─────────────────────────────────────────────── */
:root{
  --bg:#0c0e12;--surface:#14171e;--surface-2:#191d26;
  --line:#252b38;--line-strong:#343d50;
  --fg:#e9ecf3;--fg-2:#c6ccd9;--muted:#8b94a7;--faint:#626b7e;
  --ok:#3ecf8e;--ok-dim:rgba(62,207,142,.13);
  --warn:#e9b25c;--warn-dim:rgba(233,178,92,.13);
  --err:#ef6a61;--err-dim:rgba(239,106,97,.13);
  --r-sm:6px;--r-md:10px;--r-lg:14px;
  --t-fast:140ms;--t-std:260ms;--t-slow:560ms;
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-std:cubic-bezier(.4,0,.2,1);
}
/* ── base ────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0 auto;padding:24px 20px 48px;max-width:1160px;background:var(--bg);color:var(--fg);
  font:13.5px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.tnum{font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.err{color:var(--err)}
::selection{background:rgba(62,207,142,.25)}
:where(button,a,input,[tabindex]):focus-visible{outline:2px solid var(--ok);outline-offset:2px}
button:active{transform:scale(.98)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fill-in{from{transform:scaleX(0)}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes shimmer{to{background-position:-200% 0}}
/* ── header ──────────────────────────────────────────────────── */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
h1{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.3}
h1 .mark{width:8px;height:8px;border-radius:2px;background:var(--ok);box-shadow:0 0 0 4px var(--ok-dim);flex:none}
h1 .tag{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;letter-spacing:.02em}
#hdrMeta{margin:0;color:var(--muted);font-size:12px}
/* ── section titles ──────────────────────────────────────────── */
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:30px 0 12px}
.sec-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.sec-label .zn{font-style:normal;color:var(--ok)}
.sec-hint{font-weight:400;letter-spacing:0;color:var(--faint)}
.sec-title .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* ── buttons ─────────────────────────────────────────────────── */
.btn,.refresh{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:12px;font-weight:500;line-height:1;
  color:var(--fg-2);background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;
  transition:border-color var(--t-fast) var(--ease-std),background-color var(--t-fast) var(--ease-std),color var(--t-fast) var(--ease-std)}
.btn-solid{background:var(--ok);border-color:var(--ok);color:#08281a}
.btn-danger{background:var(--err);border-color:var(--err);color:#2a0705}
.refresh .ic{display:inline-block}
body.is-loading .refresh .ic{animation:spin .8s linear infinite}
body.is-loading .refresh{opacity:.6;pointer-events:none}
/* ── account cards ───────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px;margin-bottom:4px}
.acc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;
  animation:rise var(--t-std) var(--ease-out) both;animation-delay:calc(var(--i,0)*45ms);
  transition:border-color var(--t-fast) var(--ease-std),background-color var(--t-fast) var(--ease-std)}
.acc-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.acc .nm{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-ops{display:flex;align-items:center;gap:6px;flex:none}
.acc .sub{color:var(--muted);font-size:11.5px;margin-bottom:12px;word-break:break-all}
.acc .rate{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted)}
.acc .rate b{color:var(--fg);font-size:13px}
.acc .foot{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:7px 0 8px}
.fill{height:100%;border-radius:inherit;background:var(--fill,var(--ok));transform-origin:0 50%;
  animation:fill-in var(--t-slow) var(--ease-out) both 80ms;transition:width var(--t-std) var(--ease-std)}
.acc .del{border:0;background:transparent;color:var(--faint);font-family:inherit;font-size:11px;line-height:1;padding:5px 7px;border-radius:var(--r-sm);cursor:pointer;
  opacity:0;transition:opacity var(--t-fast) var(--ease-std),color var(--t-fast) var(--ease-std),background-color var(--t-fast) var(--ease-std)}
.acc .del:focus-visible{opacity:1}
@media (hover:hover) and (pointer:fine){
  .acc:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .acc:hover .del{opacity:1}
  .acc .del:hover{color:var(--err);background:var(--err-dim)}
}
@media (hover:none){.acc .del{opacity:1}}
/* ── badges ──────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-family:inherit;font-size:10.5px;font-weight:600;letter-spacing:.02em;line-height:1.5;border:0;cursor:default;font-variant-numeric:tabular-nums}
button.badge{cursor:pointer;transition:filter var(--t-fast) var(--ease-std)}
@media (hover:hover) and (pointer:fine){button.badge:hover{filter:brightness(1.25)}}
button.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.badge.ok{background:var(--ok-dim);color:var(--ok)}
.badge.warn{background:var(--warn-dim);color:var(--warn)}
.badge.err{background:var(--err-dim);color:var(--err)}
.badge.dis{background:rgba(139,148,167,.13);color:var(--muted)}
/* ── dropdown ────────────────────────────────────────────────── */
.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:10px;width:100%;min-width:min(280px,100%);max-width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:10px 14px;cursor:pointer;user-select:none;
  font-family:inherit;font-size:13px;color:var(--fg);overflow:hidden;transition:border-color var(--t-fast) var(--ease-std)}
.dd.open .dd-btn{border-color:var(--ok)}
.dd-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .chev{margin-left:2px;flex:none;transition:transform var(--t-fast) var(--ease-std)}
.dd.open .chev{transform:rotate(180deg)}
.dd-pop{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;z-index:30;
  box-shadow:0 16px 40px rgba(0,0,0,.45);
  opacity:0;transform:translateY(-4px) scale(.98);transform-origin:0 0;visibility:hidden;pointer-events:none;
  transition:opacity var(--t-fast) var(--ease-std),transform var(--t-fast) var(--ease-std),visibility 0s var(--t-fast)}
.dd.open .dd-pop{opacity:1;transform:none;visibility:visible;pointer-events:auto;
  transition:opacity var(--t-std) var(--ease-out) 20ms,transform var(--t-std) var(--ease-out) 20ms,visibility 0s}
.dd-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;cursor:pointer;white-space:nowrap;text-align:left;
  background:transparent;border:0;font-family:inherit;font-size:12.5px;color:var(--fg);
  transition:background-color 80ms var(--ease-std)}
.dd-row.sel{background:var(--ok-dim)}
.dd-dot{width:7px;height:7px;border-radius:50%;flex:none}
.dd-file{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.dd-end{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;padding-left:12px}
@media (hover:hover) and (pointer:fine){.dd-btn:hover{border-color:var(--ok)}.dd-row:hover{background:rgba(255,255,255,.04)}}
/* ── total card & tables ─────────────────────────────────────── */
.total{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;margin-bottom:12px;animation:rise var(--t-std) var(--ease-out) both}
.total .lbl{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em}
.total .num{font-size:30px;font-weight:650;letter-spacing:-.01em;line-height:1.2;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.total .num small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.total .track{height:7px;border-radius:4px;margin:0}
.total .cap{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin-top:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);-webkit-overflow-scrolling:touch}
.tablewrap::-webkit-scrollbar{height:8px}
.tablewrap::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
.tablewrap::-webkit-scrollbar-track{background:transparent}
table{width:100%;border-collapse:collapse;border-spacing:0;font-size:12px}
th{color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.05em;white-space:nowrap}
td{padding:9px 14px;border-top:1px solid var(--line);white-space:nowrap}
tr:first-child td{border-top:0}
@media (hover:hover) and (pointer:fine){tr:hover td{background:rgba(255,255,255,.02)}}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.r b{font-size:12.5px;font-weight:600;color:var(--fg)}
.more{display:block;width:100%;padding:9px 14px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:11.5px;cursor:pointer;transition:background-color var(--t-fast) var(--ease-std),color var(--t-fast) var(--ease-std)}
@media (hover:hover) and (pointer:fine){.more:hover{background:rgba(255,255,255,.03);color:var(--fg-2)}}
/* ── generic card / auth / login ─────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;margin-bottom:12px;animation:rise var(--t-std) var(--ease-out) both}
.card.err{color:var(--err);border-color:rgba(239,106,97,.35)}
#authBox{display:none;max-width:460px}
#authBox input{flex:1;min-width:0;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);font-family:inherit;font-size:13px;transition:border-color var(--t-fast) var(--ease-std)}
#authBox input:focus{border-color:var(--ok);outline:none}
.auth-row{display:flex;gap:8px;margin-top:12px}
#loginBox{display:none;max-width:660px}
#loginBox .u{display:block;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:11.5px;margin:10px 0;color:var(--fg-2);text-decoration:none;transition:border-color var(--t-fast) var(--ease-std)}
@media (hover:hover) and (pointer:fine){#loginBox .u:hover{border-color:var(--ok)}}
.login-ops{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.4s ease-in-out infinite;flex:none}
/* ── empty / skeleton ────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:32px 16px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-md)}
.empty svg{opacity:.45;margin-bottom:4px}
.empty .btn{margin-top:10px}
.skel{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.skel-card{height:124px}
.skel-block{height:150px;margin-top:12px}
.skel-line{height:14px;border:0;border-radius:4px;margin:14px 0;width:24%}
/* ── dialog ──────────────────────────────────────────────────── */
dialog{background:var(--surface-2);color:var(--fg);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:20px 22px;min-width:300px;max-width:min(92vw,420px);
  box-shadow:0 24px 64px rgba(0,0,0,.5);
  transition:opacity var(--t-std) var(--ease-out),transform var(--t-std) var(--ease-out),overlay var(--t-std) allow-discrete,display var(--t-std) allow-discrete}
dialog::backdrop{background:rgba(4,6,9,.55)}
@starting-style{dialog[open]{opacity:0;transform:translateY(6px) scale(.98)}}
.dlg-title{font-size:14px;font-weight:650;margin:0 0 8px}
.dlg-msg{margin:0;color:var(--fg-2);font-size:12.5px;line-height:1.7}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
/* ── responsive & motion floor ───────────────────────────────── */
@media (max-width:560px){
  body{padding:16px 14px 32px}
  .detail-head{flex-direction:column;align-items:stretch}
  .detail-head>.meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
  .sec-title{margin-top:24px}
}
@media (pointer:coarse){.btn,.refresh{padding:10px 14px}.badge{padding:5px 11px}.dd-row{padding:12px 14px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="hdr">
  <h1><i class="mark" aria-hidden="true"></i>WorkBuddy<span class="tag">CPA 插件面板</span></h1>
  <p class="meta" id="hdrMeta">正在加载…</p>
</header>
<div id="authBox" class="card">
  <div class="meta" style="margin-bottom:2px">需要 CPA 管理密钥才能读取额度数据。</div>
  <div class="meta" style="color:var(--faint);font-size:11px">密钥只保存在本页会话中，刷新页面后需重新输入。</div>
  <div class="auth-row">
    <input id="keyInput" type="password" placeholder="粘贴 management key" aria-label="CPA management key" autocomplete="off" spellcheck="false">
    <button class="btn btn-solid" onclick="saveKey()">确认</button>
  </div>
</div>
<div id="loginBox" class="card">
  <div class="meta" style="margin-bottom:2px">添加账号 · 用 CodeBuddy 客户端打开下面的授权链接完成登录，成功后自动保存为独立凭据文件。</div>
  <a id="loginLink" class="u" href="#" target="_blank" rel="noopener"></a>
  <div class="login-ops">
    <button class="btn" onclick="copyLoginUrl()">复制链接</button>
    <button class="btn" onclick="cancelLogin()">取消</button>
    <span id="loginStatus" class="meta" aria-live="polite"></span>
  </div>
</div>
<div id="content">
  <div aria-hidden="true">
    <div class="skel-line"></div>
    <div class="cards" style="margin-top:12px">
      <div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div>
    </div>
    <div class="skel-line" style="width:34%;margin-top:26px"></div>
    <div class="skel skel-block"></div>
  </div>
</div>
<dialog id="confirmDlg" aria-labelledby="dlgTitle">
  <p class="dlg-title" id="dlgTitle">删除账号</p>
  <p class="dlg-msg" id="confirmMsg"></p>
  <div class="dlg-actions">
    <button class="btn" onclick="document.getElementById('confirmDlg').close()">取消</button>
    <button class="btn btn-danger" onclick="document.getElementById('confirmDlg').close('ok')">删除</button>
  </div>
</dialog>
<script>
const API = "/v0/management/plugins/workbuddy";
/* Credential lifecycle (enable/disable, delete) belongs to the host, which owns
   the auth files. host.auth.save can NOT persist a `disabled` rewrite, so the
   panel talks to the host's own auth-files endpoints (same ones its own UI uses). */
const HOSTFL = "/v0/management/auth-files";
/* management key acquisition: CPA localStorage → ?key= → manual input */
const ENC_PREFIX="enc::v1::",SECRET_SALT="cli-proxy-api-webui::secure-storage",PANEL_STORE="cli-proxy-auth",SS_KEY="workbuddy-mgmt-key";
function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}
function readPanelKey(){
  if(!isEmbedded())return null;
  let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{const parsed=JSON.parse(deobfuscate(raw));const st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null}catch(e){return null}
}
function readUrlKey(){const m=new URLSearchParams(window.location.search).get("key");if(m)history.replaceState(null,"",window.location.pathname);return m}
function getKey(){return sessionStorage.getItem(SS_KEY)||readPanelKey()||readUrlKey()}
function saveKey(){const v=document.getElementById("keyInput").value.trim();if(!v)return;sessionStorage.setItem(SS_KEY,v);document.getElementById("authBox").style.display="none";load()}
function showAuth(){document.getElementById("authBox").style.display="block";const i=document.getElementById("keyInput");i&&i.focus()}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const NF=new Intl.NumberFormat("zh-CN");
function fmtNum(v){return typeof v==="number"?NF.format(v):(v??="",""+v)}
function fmtDate(s){const m=/(\d{4}-\d{2}-\d{2})/.exec(s||"");return m?m[1]:"—"}
function daysLeft(cycleEnd){
  const m=/(\d{4})-(\d{2})-(\d{2})/.exec(cycleEnd||"");
  if(!m)return null;
  const end=Date.UTC(+m[1],+m[2]-1,+m[3],23,59,59);
  return Math.ceil((end-Date.now())/86400000);
}
function dayBadge(cycleEnd){
  const d=daysLeft(cycleEnd);
  if(d===null)return '<span class="badge dis">—</span>';
  if(d<0)return '<span class="badge err">已过期</span>';
  return '<span class="badge '+(d<=7?"err":"ok")+'">'+d+' 天</span>';
}
let DATA=null, SELECTED=null, RECENT=[];

function accDisplayName(acc){
  return acc.nickname || (acc.name||"").replace(/^workbuddy-/,"").replace(/\.json$/,"") || "账号";
}
function rateColor(pct){return pct<=20?"var(--err)":pct<=50?"var(--warn)":"var(--ok)"}

function zone1Title(){
  return '<div class="sec-title"><span class="sec-label"><i class="zn">①</i>账号<span class="sec-hint">点徽章启停 · ✕ 删除账号</span></span>'+
    '<span class="tools"><button class="btn" onclick="addAccount()">＋ 添加账号</button>'+
    '<button class="refresh" onclick="load()"><span class="ic" aria-hidden="true">↻</span>全部刷新</button></span></div>';
}
/* 自绘下拉：状态点 + 昵称 + 文件名 + 剩余率徽标；弹层同构，选中行打勾 */
const CHEV='<svg class="chev" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="#8b94a7" stroke-width="1.5" stroke-linecap="round"/></svg>';
const CHECK='<svg width="12" height="10" viewBox="0 0 12 10"><path d="M1 5l3.5 3.5L11 1" fill="none" stroke="#3ecf8e" stroke-width="1.8" stroke-linecap="round"/></svg>';
function accPct(acc){const c=acc.credits||{};const remain=c.total_remain||0,size=c.total_size||0;return size>0?Math.round(remain/size*100):0}
function accDot(acc){const c=acc.credits||{};if(!acc.enabled)return '<span class="dd-dot" style="background:var(--muted)"></span>';if(acc.unavailable||c.error)return '<span class="dd-dot" style="background:var(--err)"></span>';return '<span class="dd-dot" style="background:var(--ok)"></span>'}
function pctBadge(pct){const cls=pct<=20?"err":pct<=50?"warn":"ok";return '<span class="badge '+cls+'">'+pct+'%</span>'}
function ddHtml(accs,sel){
  const cur=accs.find(a=>a.auth_index===sel)||accs[0];
  if(!cur)return "";
  const rows=accs.map(a=>{
    const selA=a.auth_index===sel;
    return '<button class="dd-row'+(selA?" sel":"")+'" role="option" aria-selected="'+selA+'" onclick="ddPick(\''+esc(a.auth_index)+'\')">'+
    accDot(a)+'<span class="dd-name">'+esc(accDisplayName(a))+'</span>'+
    '<span class="dd-file">'+esc(a.name||"")+'</span>'+
    '<span class="dd-end">'+pctBadge(accPct(a))+(selA?CHECK:'')+'</span></button>';
  }).join("");
  return '<div class="dd" id="ddWrap">'+
    '<button class="dd-btn" id="ddBtn" aria-haspopup="listbox" aria-expanded="false" onclick="ddToggle(event)">'+accDot(cur)+'<span class="dd-name">'+esc(accDisplayName(cur))+'</span>'+
    '<span class="dd-file">'+esc(cur.name||"")+'</span>'+
    '<span class="dd-end">'+pctBadge(accPct(cur))+'</span>'+CHEV+'</button>'+
    '<div class="dd-pop" id="ddPop" role="listbox">'+rows+'</div></div>';
}
function ddToggle(e){e.stopPropagation();const w=document.getElementById("ddWrap");if(!w)return;const open=w.classList.toggle("open");const b=document.getElementById("ddBtn");b&&b.setAttribute("aria-expanded",open?"true":"false")}
function ddClose(){const w=document.getElementById("ddWrap");if(w)w.classList.remove("open");const b=document.getElementById("ddBtn");b&&b.setAttribute("aria-expanded","false")}
function ddPick(idx){SELECTED=idx;render()}
document.addEventListener("click",e=>{const w=document.getElementById("ddWrap");if(w&&w.classList.contains("open")&&!e.target.closest(".dd"))ddClose()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")ddClose()});
function render(){
  const el=document.getElementById("content");
  const hdrMeta=document.getElementById("hdrMeta");
  if(!DATA)return;
  if(DATA.error){hdrMeta.textContent="—";el.innerHTML='<div class="card err"><b>额度查询失败</b>　'+esc(DATA.error)+'</div>';return}
  const accounts=DATA.accounts||[];
  if(!accounts.length){hdrMeta.textContent="0 个账号";
    el.innerHTML=zone1Title()+'<div class="empty">'+
      '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>'+
      '<div>暂无 workbuddy 凭据</div><div class="dim">添加账号后即可查看额度与用量</div>'+
      '<button class="btn" onclick="addAccount()">＋ 添加账号</button></div>';
    return}
  if(!SELECTED || !accounts.find(a=>a.auth_index===SELECTED)) SELECTED=accounts[0].auth_index;
  const packSum=accounts.reduce((s,a)=>s+((a.credits&&a.credits.pack_count)||0),0);
  hdrMeta.textContent=accounts.length+" 个账号 · "+packSum+" 个套餐";

  let cards="";
  accounts.forEach((acc,i)=>{
    const c=acc.credits||{};
    const remain=c.total_remain||0, size=c.total_size||0;
    const pct=size>0?Math.round(remain/size*100):0;
    const color=rateColor(pct);
    let earliest=null;
    for(const p of (c.packages||[])){
      if(!earliest || String(p.cycle_end)<String(earliest.cycle_end)) earliest=p;
    }
    const earlyTxt = earliest ? "最早到期 "+fmtDate(earliest.cycle_end)+" · "+(daysLeft(earliest.cycle_end)??'?')+" 天" : (c.error?("查询失败:"+c.error):"");
    const badgeCls = !acc.enabled ? "dis" : (acc.unavailable||c.error?"err":pct<=20?"err":pct<=50?"warn":"ok");
    const badgeTxt = !acc.enabled ? "已停用" : (acc.unavailable?"不可用":c.error?"异常":pct+"%");
    const label = accDisplayName(acc);
    const fn = acc.file_name||acc.name||"";
    cards+='<div class="acc" style="--i:'+i+'">'+
      '<div class="acc-head"><span class="nm" title="'+esc(label)+'">'+esc(label)+'</span><span class="acc-ops">'+
      '<button class="badge '+badgeCls+'" title="点击启用/停用" onclick="event.stopPropagation();toggleAccount(\''+esc(fn)+'\','+(!acc.enabled)+')">'+badgeTxt+'</button>'+
      (fn?'<button class="del" title="删除该账号" onclick="event.stopPropagation();deleteAccount(\''+esc(fn)+'\',\''+esc(label)+'\')">✕ 删除</button>':'')+
      '</span></div>'+
      '<div class="sub">'+esc(acc.name||"")+' · '+((c.pack_count)||0)+' 套餐</div>'+
      '<div class="rate"><span>总剩余率</span><b class="tnum">'+pct+'%</b></div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%;--fill:'+color+'"></div></div>'+
      '<div class="foot"><span class="tnum">剩余 '+fmtNum(c.total_remain ?? '?')+'</span><span>'+esc(earlyTxt)+'</span></div>'+
    '</div>';
  });

  const acc=accounts.find(a=>a.auth_index===SELECTED);
  const c=(acc&&acc.credits)||{};
  let detail;
  if(c.error){detail='<div class="card err">额度查询失败：'+esc(c.error)+'</div>'}
  else{
    const remain=c.total_remain||0,used=c.total_used||0,size=c.total_size||(remain+used);
    const pct=size>0?(remain/size*100):0;
    const color=rateColor(pct);
    const packs=(c.packages||[]).slice().sort((a,b)=>String(a.cycle_end).localeCompare(String(b.cycle_end)));
    const rows=packs.map((p,i)=>
      '<tr'+(i>=6?' class="xrow" style="display:none"':'')+'><td>'+esc(p.name)+'</td><td class="dim tnum">'+fmtDate(p.cycle_start)+'</td><td class="dim tnum">'+fmtDate(p.cycle_end)+'</td><td>'+dayBadge(p.cycle_end)+'</td><td class="r"><b>'+fmtNum(p.remain)+'</b> <span class="dim">/ '+fmtNum(p.size)+'</span></td></tr>').join("");
    const moreBtn=packs.length>6?'<button class="more" onclick="expandRows(this)">展开全部 '+packs.length+' 个套餐 ▾</button>':"";
    detail='<div class="total"><div class="lbl">总积分额度</div>'+
      '<div class="num">'+fmtNum(remain)+' <small>/ '+fmtNum(size)+' credits · 剩余 '+pct.toFixed(1)+'%</small></div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%;--fill:'+color+'"></div></div>'+
      '<div class="cap"><span class="tnum">剩余 '+fmtNum(remain)+'</span><span class="tnum">已用 '+fmtNum(used)+'</span></div></div>'+
      '<div class="tablewrap"><table><tr><th>套餐</th><th>开始时间</th><th>到期时间</th><th>剩余天数</th><th style="text-align:right">剩余额度</th></tr>'+rows+'</table>'+(moreBtn||"")+'</div>';
  }
  el.innerHTML=
    zone1Title()+
    '<div class="cards">'+cards+'</div>'+
    '<div class="sec-title"><span class="sec-label"><i class="zn">②</i>最近调用<span class="sec-hint">最近 10 条 · CodeBuddy 不提供按次积分，以 token 计</span></span>'+
    '<span class="tools"><button class="refresh" onclick="load()"><span class="ic" aria-hidden="true">↻</span>刷新</button></span></div>'+
    recentTable()+
    '<div class="sec-title"><span class="sec-label"><i class="zn">③</i>账号额度明细<span class="sec-hint">选择账号查看</span></span></div>'+
    '<div class="detail-head">'+ddHtml(accounts,SELECTED)+
    '<span class="meta">快照 '+esc(String((c&&c.fetched_at)||DATA.fetched_at||"").replace("T"," ").replace("Z"," UTC"))+' · <button class="refresh" onclick="load()"><span class="ic" aria-hidden="true">↻</span>刷新</button></span></div>'+
    detail;
}
function expandRows(btn){document.querySelectorAll('.xrow').forEach(r=>r.style.display='table-row');btn.remove()}

/* ③ 最近调用：插件内存里的最近 10 条（CPA 重启清零）。
   CodeBuddy 不提供按次积分明细，消耗只能以 token 计；账号级积分看上面两区。 */
function recentTable(){
  const calls=RECENT||[];
  if(!calls.length)return '<div class="empty">'+
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>'+
    '<div>暂无调用记录</div><div class="dim">记录存于插件内存，CPA 重启后清零</div></div>';
  const rows=calls.map(c=>{
    const t=new Date((c.ts||0)*1000);
    const time=isNaN(t)?"—":t.toLocaleTimeString("zh-CN",{hour12:false});
    const acct=esc(c.nickname||"")+' <span class="dim">'+esc(String(c.auth_id||"").replace(/^workbuddy-/,""))+'</span>';
    const model=esc(c.model||"")+(c.stream?' <span class="dim">流式</span>':'');
    const status=c.ok?'<span class="badge ok">成功</span>':'<span class="badge err" title="'+esc(String(c.error||"").slice(0,200))+'">失败</span>';
    const split=(c.total_tokens>0&&c.total_tokens!==undefined)?('<span class="dim">'+fmtNum(c.prompt_tokens||0)+' / </span>'+fmtNum(c.completion_tokens||0)):'<span class="dim">—</span>';
    return '<tr><td class="dim tnum">'+time+'</td><td>'+acct+'</td><td>'+model+'</td>'+
      '<td class="r">'+split+'</td><td class="r"><b>'+fmtNum(c.total_tokens||0)+'</b></td>'+
      '<td>'+status+'</td><td class="r dim tnum">'+fmtNum(c.duration_ms||0)+' ms</td></tr>';
  }).join("");
  return '<div class="tablewrap"><table><tr><th>时间</th><th>账号</th><th>模型</th>'+
    '<th style="text-align:right">输入 / 输出</th><th style="text-align:right">总 tokens</th>'+
    '<th>状态</th><th style="text-align:right">耗时</th></tr>'+rows+'</table></div>';
}

/* 启停：走宿主权威接口（插件侧 host.auth.save 无法持久化 disabled） */
async function toggleAccount(fileName,enable){
  if(!fileName){alert("该账号没有对应的凭据文件，无法启停。");return}
  const k=getKey();if(!k){showAuth();return}
  try{
    const r=await fetch(HOSTFL+"/status",{method:"PATCH",credentials:"omit",
      headers:{"Authorization":"Bearer "+k,"Content-Type":"application/json"},
      body:JSON.stringify({name:fileName,disabled:!enable})});
    if(!r.ok){alert("启停失败："+r.status+" "+await r.text());return}
    await load();
  }catch(e){alert("启停失败："+String(e))}
}
async function load(){
  const k=getKey();
  if(!k){showAuth();document.getElementById("content").innerHTML='<div class="card meta">输入管理密钥后查看额度。</div>';return}
  document.body.classList.add("is-loading");
  try{
    const [ra,rr]=await Promise.all([
      fetch(API+"/accounts",{credentials:"omit",headers:{"Authorization":"Bearer "+k}}),
      fetch(API+"/recent",{credentials:"omit",headers:{"Authorization":"Bearer "+k}}).catch(()=>null)
    ]);
    if(ra.status===401){sessionStorage.removeItem(SS_KEY);showAuth();document.getElementById("content").innerHTML='<div class="card err">密钥无效或已过期。</div>';return}
    DATA=await ra.json();
    try{const d=await rr.json();RECENT=(d&&d.calls)||[]}catch(e){RECENT=[]}
    render();
  }catch(e){
    let hint="";
    if(location.protocol==="file:")hint="面板当前以文件方式打开，访问不到 CPA 管理接口。请编译并部署插件后，从 CPA 管理界面打开本面板。";
    else if(e instanceof TypeError)hint="无法连接 "+location.origin+" 的 CPA 管理接口。请确认 CPA 正在运行，并从 CPA 管理界面打开本面板。";
    document.getElementById("content").innerHTML='<div class="card err"><b>加载失败</b>　'+esc(String(e))+
      (hint?'<div class="dim" style="margin-top:6px;font-size:12px">'+esc(hint)+'</div>':"")+'</div>';
  }
  finally{document.body.classList.remove("is-loading")}
}

/* ---- 多账号：新增 / 删除 ---- */
let LOGIN=null, LOGIN_TIMER=null;
function apiHeaders(extra){
  const k=getKey()||"";
  return Object.assign({"Authorization":"Bearer "+k}, extra||{});
}
function loginStatus(html){document.getElementById("loginStatus").innerHTML=html}

async function addAccount(){
  if(!getKey()){showAuth();return}
  const box=document.getElementById("loginBox");
  box.style.display="block";
  document.getElementById("loginLink").removeAttribute("href");
  document.getElementById("loginLink").textContent="正在申请授权链接…";
  loginStatus('<span class="live"><i class="pulse" aria-hidden="true"></i>等待授权中…</span>');
  try{
    const r=await fetch(API+"/login/start",{credentials:"omit",headers:apiHeaders()});
    const d=await r.json();
    if(d.error||!d.url){loginStatus('<span class="err">'+esc(d.error||"未返回授权链接")+'</span>');return}
    LOGIN=d;
    const link=document.getElementById("loginLink");
    link.href=d.url;link.textContent=d.url;
    loginStatus('<span class="live"><i class="pulse" aria-hidden="true"></i>等待授权中… 链接 5 分钟内有效</span>');
    clearInterval(LOGIN_TIMER);
    LOGIN_TIMER=setInterval(pollLogin,2000);
  }catch(e){loginStatus('<span class="err">'+esc(String(e))+'</span>')}
}

async function pollLogin(){
  if(!LOGIN)return;
  if(!getKey()){cancelLogin();return}
  try{
    const r=await fetch(API+"/login/poll",{method:"POST",credentials:"omit",
      headers:apiHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify({state:LOGIN.state})});
    const d=await r.json();
    if(d.status==="success"){
      const saved=d.saved!==false;
      cancelLogin();
      if(!saved){alert("登录成功，但保存凭据失败："+(d.error||""))}
      SELECTED=null;
      await load();
      return;
    }
    if(d.status==="error"){
      clearInterval(LOGIN_TIMER);LOGIN_TIMER=null;
      loginStatus('<span class="err">'+esc(d.message||"登录失败")+(d.message&&d.message.indexOf("expired")>=0?"，请重新添加":"")+'</span>');
      return;
    }
    loginStatus('<span class="live"><i class="pulse" aria-hidden="true"></i>等待授权中…</span>');
  }catch(e){/* 下一次轮询继续 */}
}

function copyLoginUrl(){
  if(!LOGIN||!LOGIN.url)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(LOGIN.url)}
  else{const t=document.createElement("textarea");t.value=LOGIN.url;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  loginStatus('链接已复制');
}

function cancelLogin(){
  clearInterval(LOGIN_TIMER);LOGIN_TIMER=null;LOGIN=null;
  document.getElementById("loginBox").style.display="none";
}

/* 删除：走宿主 auth-files 删除接口，宿主会同时清掉内存与磁盘上的凭据 */
let PENDING_DELETE=null;
function askDelete(label,fn){
  const dlg=document.getElementById("confirmDlg");
  document.getElementById("confirmMsg").textContent='删除账号「'+label+'」？该账号的凭据文件会被移除，操作不可撤销。';
  if(dlg&&typeof dlg.showModal==="function"){PENDING_DELETE=fn;dlg.showModal()}
  else if(window.confirm('删除账号「'+label+'」？该账号的凭据文件会被移除。'))fn();
}
async function deleteAccount(fileName,label){
  if(!getKey()){showAuth();return}
  askDelete(label,()=>doDelete(fileName));
}
async function doDelete(fileName){
  try{
    const r=await fetch(HOSTFL,{method:"DELETE",credentials:"omit",
      headers:apiHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify({names:[fileName]})});
    if(!r.ok){alert("删除失败："+r.status+" "+await r.text());return}
    SELECTED=null;
    await load();
  }catch(e){alert("删除失败："+String(e))}
}
document.getElementById("confirmDlg").addEventListener("close",()=>{
  const fn=PENDING_DELETE;PENDING_DELETE=null;
  if(document.getElementById("confirmDlg").returnValue==="ok"&&fn)fn();
});

window.addEventListener("load",load);
</script>
