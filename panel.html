<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e9ef;--dim:#8b93a3;--ok:#34c37e;--warn:#e5a23c;--err:#e5534b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
h1{font-size:17px;margin:0 0 14px}
.sec-title{font-size:12px;color:var(--dim);letter-spacing:.5px;margin:14px 0 10px;display:flex;justify-content:space-between;align-items:center}
.refresh{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:1px 10px;font-size:11px;color:var(--dim)}
.refresh:hover{filter:brightness(1.4)}
.meta{color:var(--dim);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative;cursor:pointer}
.acc:hover{border-color:var(--dim)}
.acc.selected{border-color:var(--ok)}
.acc .nm{font-size:13.5px;font-weight:600;margin-bottom:2px}
.acc .sub{color:var(--dim);font-size:11px;margin-bottom:8px}
.acc .rate{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.acc .rate b{color:var(--fg);font-size:12.5px}
.acc .track{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:5px 0 4px}
.acc .fill{height:100%;border-radius:4px;transition:width .3s}
.acc .foot{display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px}
.badge{padding:1px 8px;border-radius:99px;font-size:10px;cursor:pointer;border:0}
.badge.ok{background:rgba(52,195,126,.14);color:var(--ok)}
.badge.warn{background:rgba(229,162,60,.15);color:var(--warn)}
.badge.err{background:rgba(229,83,75,.16);color:var(--err)}
.badge.dis{background:rgba(139,147,163,.14);color:var(--dim)}
.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12.5px}
.total{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.total .lbl{color:var(--dim);font-size:11px;letter-spacing:.4px}
.total .num{font-size:22px;font-weight:600;margin:2px 0 8px}
.total .num small{font-size:11.5px;color:var(--dim);font-weight:400}
.total .track{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.total .fill{height:100%;border-radius:5px;transition:width .3s}
.total .cap{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:4px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
th{color:var(--dim);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:10.5px;white-space:nowrap}
td{padding:8px 12px;border-top:1px dashed var(--line);white-space:nowrap}
tr:first-child td{border-top:0}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.r b{font-size:13px}
.dim{color:var(--dim)}
.foot{color:var(--dim);font-size:11px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.err{color:var(--err);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
#authBox{display:none;max-width:420px}
#authBox input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button.rf{margin:0;padding:2px 12px;font-size:11px}
.acc .del{position:absolute;top:6px;right:8px;color:var(--dim);font-size:11px;line-height:1;padding:3px 6px;border-radius:6px;opacity:0;transition:opacity .15s;cursor:pointer}
.acc:hover .del{opacity:1}
.acc .del:hover{color:var(--err);background:rgba(229,83,75,.12)}
.sec-title .tools{display:flex;gap:6px;align-items:center}
#loginBox{display:none;max-width:560px}
#loginBox .u{display:block;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;margin:6px 0;color:var(--fg);text-decoration:none}
#loginBox .u:hover{border-color:var(--ok)}
.btn{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:11px;color:var(--dim);background:transparent;font-family:inherit}
.btn:hover{filter:brightness(1.4)}
</style>
</head>
<body>
<h1>WorkBuddy <span class="meta">多账号配额管理</span></h1>
<div id="authBox" class="card">
  <div class="meta" style="margin-bottom:6px">需要 CPA 管理密钥：</div>
  <input id="keyInput" type="password" placeholder="粘贴 management key">
  <button class="refresh" onclick="saveKey()">确认</button>
</div>
<div id="loginBox" class="card">
  <div class="meta" style="margin-bottom:2px">添加账号 · 用 CodeBuddy 客户端打开下面的授权链接完成登录，成功后自动保存为独立凭据文件。</div>
  <a id="loginLink" class="u" href="#" target="_blank" rel="noopener"></a>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn" onclick="copyLoginUrl()">复制链接</button>
    <button class="btn" onclick="cancelLogin()">取消</button>
    <span id="loginStatus" class="meta"></span>
  </div>
</div>
<div id="content"><div class="card meta">加载中…</div></div>
<script>
const API = "/v0/management/plugins/workbuddy";
/* Credential lifecycle (enable/disable, delete) belongs to the host, which owns
   the auth files. host.auth.save can NOT persist a `disabled` rewrite, so the
   panel talks to the host's own auth-files endpoints (same ones its own UI uses). */
const HOSTFL = "/v0/management/auth-files";
/* management key acquisition: CPA localStorage → ?key= → manual input */
const ENC_PREFIX="enc::v1::",SECRET_SALT="cli-proxy-api-webui::secure-storage",PANEL_STORE="cli-proxy-auth",SS_KEY="workbuddy-mgmt-key";
function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}
function readPanelKey(){
  if(!isEmbedded())return null;
  let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{const parsed=JSON.parse(deobfuscate(raw));const st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null}catch(e){return null}
}
function readUrlKey(){const m=new URLSearchParams(window.location.search).get("key");if(m)history.replaceState(null,"",window.location.pathname);return m}
function getKey(){return sessionStorage.getItem(SS_KEY)||readPanelKey()||readUrlKey()}
function saveKey(){const v=document.getElementById("keyInput").value.trim();if(!v)return;sessionStorage.setItem(SS_KEY,v);document.getElementById("authBox").style.display="none";load()}
function showAuth(){document.getElementById("authBox").style.display="block";const i=document.getElementById("keyInput");i&&i.focus()}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(s){const m=/(\d{4}-\d{2}-\d{2})/.exec(s||"");return m?m[1]:"—"}
function daysLeft(cycleEnd){
  const m=/(\d{4})-(\d{2})-(\d{2})/.exec(cycleEnd||"");
  if(!m)return null;
  const end=Date.UTC(+m[1],+m[2]-1,+m[3],23,59,59);
  return Math.ceil((end-Date.now())/86400000);
}
function dayBadge(cycleEnd){
  const d=daysLeft(cycleEnd);
  if(d===null)return '<span class="badge dis">—</span>';
  if(d<0)return '<span class="badge err">已过期</span>';
  return '<span class="badge '+(d<=7?"err":"ok")+'">'+d+' 天</span>';
}
let DATA=null, SELECTED=null;

function accDisplayName(acc){
  return acc.nickname || (acc.name||"").replace(/^workbuddy-/,"").replace(/\.json$/,"") || "账号";
}
function rateColor(pct){return pct<=20?"var(--err)":pct<=50?"var(--warn)":"var(--ok)"}

function zone1Title(){
  return '<div class="sec-title"><span>① 账号配额总览（点卡片看明细 · 点徽章启停 · 悬停右上 ✕ 删除）</span>'+
    '<span class="tools"><span class="refresh" onclick="addAccount()">＋ 添加账号</span>'+
    '<span class="refresh" onclick="load()">↻ 全部刷新</span></span></div>';
}
function render(){
  const el=document.getElementById("content");
  if(!DATA)return;
  if(DATA.error){el.innerHTML='<div class="card err">'+esc(DATA.error)+'</div>';return}
  const accounts=DATA.accounts||[];
  if(!accounts.length){el.innerHTML=zone1Title()+'<div class="card meta">暂无 workbuddy 凭据，点「＋ 添加账号」扫码登录。</div>';return}
  if(!SELECTED || !accounts.find(a=>a.auth_index===SELECTED)) SELECTED=accounts[0].auth_index;

  let cards="";
  for(const acc of accounts){
    const c=acc.credits||{};
    const remain=c.total_remain||0, size=c.total_size||0;
    const pct=size>0?Math.round(remain/size*100):0;
    const color=rateColor(pct);
    let earliest=null;
    for(const p of (c.packages||[])){
      if(!earliest || String(p.cycle_end)<String(earliest.cycle_end)) earliest=p;
    }
    const earlyTxt = earliest ? "最早到期 "+fmtDate(earliest.cycle_end)+" · "+(daysLeft(earliest.cycle_end)??'?')+" 天" : (c.error?("查询失败:"+c.error):"");
    const badgeCls = !acc.enabled ? "dis" : (acc.unavailable||c.error?"err":pct<=20?"err":pct<=50?"warn":"ok");
    const badgeTxt = !acc.enabled ? "已停用" : (acc.unavailable?"不可用":c.error?"异常":pct+"%");
    const label = accDisplayName(acc);
    const fn = acc.file_name||acc.name||"";
    cards+='<div class="acc'+(acc.auth_index===SELECTED?" selected":"")+'" onclick="selectAccount(\''+esc(acc.auth_index)+'\')">'+
      (fn?'<span class="del" title="删除该账号" onclick="event.stopPropagation();deleteAccount(\''+esc(fn)+'\',\''+esc(label)+'\')">✕ 删除</span>':'')+
      '<span class="badge '+badgeCls+'" title="点击启用/停用" onclick="event.stopPropagation();toggleAccount(\''+esc(fn)+'\','+(!acc.enabled)+')">'+badgeTxt+'</span>'+
      '<div class="nm">'+esc(label)+'</div>'+
      '<div class="sub">'+esc(acc.name||"")+' · '+((c.pack_count)||0)+' 套餐</div>'+
      '<div class="rate"><span>总剩余率</span><b>'+pct+'%</b></div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
      '<div class="foot"><span>剩余 '+(c.total_remain??'?')+'</span><span>'+esc(earlyTxt)+'</span></div>'+
    '</div>';
  }

  const acc=accounts.find(a=>a.auth_index===SELECTED);
  const c=(acc&&acc.credits)||{};
  let detail;
  if(c.error){detail='<div class="card err">额度查询失败：'+esc(c.error)+'</div>'}
  else{
    const remain=c.total_remain||0,used=c.total_used||0,size=c.total_size||(remain+used);
    const pct=size>0?(remain/size*100):0;
    const color=rateColor(pct);
    const packs=(c.packages||[]).slice().sort((a,b)=>String(a.cycle_end).localeCompare(String(b.cycle_end)));
    const rows=packs.map((p,i)=>
      '<tr'+(i>=6?' class="xrow" style="display:none"':'')+'><td>'+esc(p.name)+'</td><td class="dim">'+fmtDate(p.cycle_start)+'</td><td class="dim">'+fmtDate(p.cycle_end)+'</td><td>'+dayBadge(p.cycle_end)+'</td><td class="r"><b>'+p.remain+'</b> <span class="dim">/ '+p.size+'</span></td></tr>').join("");
    const moreBtn=packs.length>6?'<div class="meta" style="padding:6px 12px;cursor:pointer" onclick="expandRows(this)">展开全部 '+packs.length+' 个套餐</div>':"";
    detail='<div class="total"><div class="lbl">总积分额度</div>'+
      '<div class="num">'+remain+' <small>/ '+size+' credits 剩余 '+pct.toFixed(1)+'%</small></div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
      '<div class="cap"><span>剩余 '+remain+'</span><span>已用 '+used+'</span></div></div>'+
      '<div class="tablewrap"><table><tr><th>套餐</th><th>开始时间</th><th>到期时间</th><th>剩余天数</th><th style="text-align:right">剩余额度</th></tr>'+rows+'</table>'+(moreBtn?'<div class="card" style="padding:0">'+moreBtn+'</div>':"")+'</div>';
  }
  const options=accounts.map(a=>'<option value="'+esc(a.auth_index)+'"'+(a.auth_index===SELECTED?" selected":"")+'>'+esc(accDisplayName(a))+' — '+esc(a.name||"")+'</option>').join("");

  el.innerHTML=
    zone1Title()+
    '<div class="cards">'+cards+'</div>'+
    '<div class="sec-title"><span>② 账号额度明细（套餐级）</span></div>'+
    '<div class="detail-head"><select onchange="selectAccount(this.value)">'+options+'</select>'+
    '<span class="meta">快照 '+esc(String((c&&c.fetched_at)||DATA.fetched_at||"").replace("T"," ").replace("Z"," UTC"))+' · <span class="refresh" onclick="load()">↻ 刷新</span></span></div>'+
    detail;
}
function selectAccount(idx){SELECTED=idx;render()}
function expandRows(btn){document.querySelectorAll('.xrow').forEach(r=>r.style.display='table-row');btn.remove()}

/* 启停：走宿主权威接口（插件侧 host.auth.save 无法持久化 disabled） */
async function toggleAccount(fileName,enable){
  if(!fileName){alert("该账号没有对应的凭据文件，无法启停。");return}
  const k=getKey();if(!k){showAuth();return}
  try{
    const r=await fetch(HOSTFL+"/status",{method:"PATCH",credentials:"omit",
      headers:{"Authorization":"Bearer "+k,"Content-Type":"application/json"},
      body:JSON.stringify({name:fileName,disabled:!enable})});
    if(!r.ok){alert("启停失败："+r.status+" "+await r.text());return}
    await load();
  }catch(e){alert("启停失败："+String(e))}
}
async function load(){
  const k=getKey();
  if(!k){showAuth();document.getElementById("content").innerHTML='<div class="card meta">输入管理密钥后查看额度。</div>';return}
  try{
    const r=await fetch(API+"/accounts",{credentials:"omit",headers:{"Authorization":"Bearer "+k}});
    if(r.status===401){sessionStorage.removeItem(SS_KEY);showAuth();document.getElementById("content").innerHTML='<div class="card err">密钥无效或已过期。</div>';return}
    DATA=await r.json();
    render();
  }catch(e){document.getElementById("content").innerHTML='<div class="card err">'+esc(String(e))+'</div>'}
}

/* ---- 多账号：新增 / 删除 ---- */
let LOGIN=null, LOGIN_TIMER=null;
function apiHeaders(extra){
  const k=getKey()||"";
  return Object.assign({"Authorization":"Bearer "+k}, extra||{});
}
function loginStatus(html){document.getElementById("loginStatus").innerHTML=html}

async function addAccount(){
  if(!getKey()){showAuth();return}
  const box=document.getElementById("loginBox");
  box.style.display="block";
  document.getElementById("loginLink").removeAttribute("href");
  document.getElementById("loginLink").textContent="正在申请授权链接…";
  loginStatus('等待授权中…');
  try{
    const r=await fetch(API+"/login/start",{credentials:"omit",headers:apiHeaders()});
    const d=await r.json();
    if(d.error||!d.url){loginStatus('<span class="err">'+esc(d.error||"未返回授权链接")+'</span>');return}
    LOGIN=d;
    const link=document.getElementById("loginLink");
    link.href=d.url;link.textContent=d.url;
    loginStatus('等待授权中… 链接 5 分钟内有效');
    clearInterval(LOGIN_TIMER);
    LOGIN_TIMER=setInterval(pollLogin,2000);
  }catch(e){loginStatus('<span class="err">'+esc(String(e))+'</span>')}
}

async function pollLogin(){
  if(!LOGIN)return;
  if(!getKey()){cancelLogin();return}
  try{
    const r=await fetch(API+"/login/poll",{method:"POST",credentials:"omit",
      headers:apiHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify({state:LOGIN.state})});
    const d=await r.json();
    if(d.status==="success"){
      const saved=d.saved!==false;
      cancelLogin();
      if(!saved){alert("登录成功，但保存凭据失败："+(d.error||""))}
      SELECTED=null;
      await load();
      return;
    }
    if(d.status==="error"){
      clearInterval(LOGIN_TIMER);LOGIN_TIMER=null;
      loginStatus('<span class="err">'+esc(d.message||"登录失败")+(d.message&&d.message.indexOf("expired")>=0?"，请重新添加":"")+'</span>');
      return;
    }
    loginStatus('等待授权中…');
  }catch(e){/* 下一次轮询继续 */}
}

function copyLoginUrl(){
  if(!LOGIN||!LOGIN.url)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(LOGIN.url)}
  else{const t=document.createElement("textarea");t.value=LOGIN.url;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  loginStatus('链接已复制');
}

function cancelLogin(){
  clearInterval(LOGIN_TIMER);LOGIN_TIMER=null;LOGIN=null;
  document.getElementById("loginBox").style.display="none";
}

/* 删除：走宿主 auth-files 删除接口，宿主会同时清掉内存与磁盘上的凭据 */
async function deleteAccount(fileName,label){
  if(!getKey()){showAuth();return}
  if(!confirm("删除账号「"+label+"」？该账号的凭据文件会被移除。"))return;
  try{
    const r=await fetch(HOSTFL,{method:"DELETE",credentials:"omit",
      headers:apiHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify({names:[fileName]})});
    if(!r.ok){alert("删除失败："+r.status+" "+await r.text());return}
    SELECTED=null;
    await load();
  }catch(e){alert("删除失败："+String(e))}
}

window.addEventListener("load",load);
</script>
</body>
</html>
