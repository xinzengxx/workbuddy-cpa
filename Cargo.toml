[package]
name = "workbuddy"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "workbuddy"

[features]
default = []
# Builds the international (Global realm) plugin: upstream www.workbuddy.ai,
# provider "workbuddy-intl", single model deepseek-v4.1-flash. See src/realm.rs.
intl = []

[dependencies]
ureq = { version = "2", features = ["json", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
rand = "0.8"
cookie_store = "0.21"
time = { version = "0.3", features = ["formatting", "parsing"] }
